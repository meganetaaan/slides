name: publish-marp
concurrency: publish-marp

on:
  push:
    branches: [ main ]
    paths:
      - slides.md
      - assets/**
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - slides.md
      - assets/**
      - package.json
      - package-lock.json
    types:
      - opened
      - reopened
      - synchronize
      - closed
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Make build directory
        run: mkdir -p build
      - name: Copy assets
        run: if [[ -d assets ]]; then cp -R assets build/assets; fi
      - name: Build HTML
        uses: docker://marpteam/marp-cli:v3.0.2
        with:
          args: --title="ｽﾀｯｸﾁｬﾝ TypeScriptでつくるオープンソースロボット" --description=\"tskaigi2024 発表資料\" --url=\"https://meganetaaan.github.io/slides-tskaigi2024/\" --author "ししかわ" --og-image https://meganetaaan.github.io/slides-tskaigi2024/assets/images/in_your_hands.jpg --bespoke.progress true --html slides.md -o build/index.html
        env:
          MARP_USER: root:root
      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
      - name: Deploy production
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./build/
          force: false
          clean-exclude: |
            pr-preview/
            rte-2026/
