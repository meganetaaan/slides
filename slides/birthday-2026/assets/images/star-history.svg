<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Star History placeholder</title>
  <desc id="desc">A placeholder line chart showing steady growth from 2021 to 2025 and acceleration in 2026.</desc>
  <rect width="1200" height="620" rx="28" fill="#f8f5ec"/>
  <g transform="translate(92 72)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#1d1d1d">GitHub Star History</text>
    <text x="0" y="38" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#6a6257">stack-chan / stack-chan</text>
    <g stroke="#d9d1c2" stroke-width="2">
      <line x1="0" y1="420" x2="980" y2="420"/>
      <line x1="0" y1="315" x2="980" y2="315"/>
      <line x1="0" y1="210" x2="980" y2="210"/>
      <line x1="0" y1="105" x2="980" y2="105"/>
    </g>
    <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#736b60">
      <text x="0" y="462">2021</text>
      <text x="188" y="462">2022</text>
      <text x="380" y="462">2023</text>
      <text x="572" y="462">2024</text>
      <text x="764" y="462">2025</text>
      <text x="940" y="462">2026</text>
    </g>
    <path d="M 0 398 C 86 390, 132 374, 194 360 C 286 339, 344 320, 392 296 C 478 258, 574 225, 684 190 C 760 166, 820 148, 870 118 C 910 92, 942 54, 980 34" fill="none" stroke="#f2b640" stroke-width="12" stroke-linecap="round"/>
    <path d="M 0 398 C 86 390, 132 374, 194 360 C 286 339, 344 320, 392 296 C 478 258, 574 225, 684 190 C 760 166, 820 148, 870 118 C 910 92, 942 54, 980 34" fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round"/>
    <g fill="#1d1d1d" stroke="#f8f5ec" stroke-width="7">
      <circle cx="392" cy="296" r="11"/>
      <circle cx="980" cy="34" r="13"/>
    </g>
    <g font-family="Inter, system-ui, sans-serif">
      <rect x="294" y="220" width="230" height="64" rx="16" fill="#ffffff" stroke="#d5c5a5"/>
      <text x="316" y="247" font-size="18" font-weight="800" fill="#1d1d1d">2023ごろ</text>
      <text x="316" y="272" font-size="16" fill="#5f594f">着実な成長</text>
      <rect x="744" y="34" width="300" height="74" rx="16" fill="#1d1d1d"/>
      <text x="768" y="64" font-size="19" font-weight="800" fill="#f8f5ec">2026</text>
      <text x="768" y="91" font-size="16" fill="#f2b640">M5StackChan以降の加速</text>
